<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lab · Agung Fitrah Wibowo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111318'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='13' fill='%23fff' text-anchor='middle'%3EAFW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
// tema & bahasa diterapkan sebelum render (kunci penyimpanan sama dengan situs utama) supaya tidak berkedip
try { if (localStorage.getItem('afw-theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {}
</script>
<style>
/* token warna & huruf diambil dari tema neo situs utama, supaya lab terasa bagian dari portofolio yang sama */
:root{--paper:#EAE4D5;--fg:#111318;--muted:#5A5F6B;--grid:#D9D2BF;--acc:#1D4ED8;--on-acc:#fff;--on-acc-m:#D9DCE3;
  --display:'Space Grotesk',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
html[data-theme=dark]{color-scheme:dark;--paper:#0D0E11;--fg:#E6E8EE;--muted:#A3A8B3;--grid:#1A1D24;--acc:#5B8CFF;--on-acc:#07080B;--on-acc-m:#07080B}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a,button{cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.skip{position:absolute;left:16px;top:-60px;background:var(--fg);color:var(--paper);padding:10px 14px;font:500 13px var(--mono);z-index:5}
.skip:focus{top:12px}

/* bingkai garis tinta 1px seperti situs utama: semua blok dipisah garis, bukan kartu */
.frame{max-width:1200px;margin:0 auto;border-left:1px solid var(--fg);border-right:1px solid var(--fg);min-height:100vh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--fg)}
.mark{margin-right:auto;font:600 22px/1 var(--display);letter-spacing:-.04em;text-decoration:none;padding:11px 0}
.mark:hover{color:var(--acc)}
.tbtn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--fg);background:transparent;font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.tbtn:hover{background:var(--fg);color:var(--paper)}
.tbtn:active{translate:0 1px}

/* kepala halaman: grid kertas milimeter seperti panel tagline situs utama (identitas yang sama), diam karena MOTION 1 */
.head{padding:72px 20px 40px;border-bottom:1px solid var(--fg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
h1{margin:0 0 24px;font:300 clamp(64px,14vw,168px)/.86 var(--display);letter-spacing:-.05em}
h1 .hl{display:inline-block;background:var(--fg);color:var(--paper);padding:.02em .08em .06em;font-weight:400}
/* latar kertas di belakang paragraf supaya garis grid tidak memotong huruf */
.intro{margin:0;max-width:52ch;width:fit-content;font-size:17px;line-height:1.55;background:var(--paper);padding:2px 0}

/* daftar lab: baris setara (RHYTHM 1 disengaja), seluruh baris adalah satu tautan; aksen biru hanya muncul saat baris disorot */
.list{list-style:none;margin:0;padding:0;flex:1}
.list li{border-bottom:1px solid var(--fg)}
.row{display:grid;grid-template-columns:72px 1fr 220px;gap:8px 24px;align-items:baseline;padding:28px 20px;text-decoration:none;transition:background-color .3s,color .3s}
.row:hover,.row:focus-visible{background:var(--acc);color:var(--on-acc);outline-offset:-4px}
.row:hover .muted,.row:focus-visible .muted{color:var(--on-acc-m)}
.row:active{background:var(--fg);color:var(--paper)}
.no{font:500 13px var(--mono)}
.row h2{margin:0 0 8px;font:400 clamp(30px,4vw,44px)/1 var(--display);letter-spacing:-.03em}
.row p{margin:0;max-width:60ch;line-height:1.55}
.meta{display:block;margin-top:14px;font:400 12px/1.7 var(--mono)}
.muted{color:var(--muted)}
/* tangkapan layar: bingkai garis tinta seperti blok lain; latar kertas gelap tipis = keadaan memuat;
   file belum ada / gagal dimuat = label teks (bukan gambar karangan) */
.row{grid-template-columns:72px 1fr minmax(220px,320px);align-items:start}
.thumb{position:relative;display:block;aspect-ratio:960/499;border:1px solid currentColor;background:color-mix(in srgb,var(--fg) 6%,var(--paper));overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.thumb.miss img{display:none}
.thumb.miss::after{content:attr(data-miss);position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font:400 12px/1.5 var(--mono);color:var(--fg)}
.row:hover .thumb.miss::after,.row:focus-visible .thumb.miss::after{color:var(--on-acc-m)}

.foot{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding:16px 20px;font:400 12px var(--mono)}
.foot a{display:inline-flex;align-items:center;min-height:44px}
.foot a:hover{color:var(--acc)}

@media (max-width:700px){
  .head{padding:48px 16px 32px}
  .bar,.foot{padding-left:16px;padding-right:16px}
  .row{grid-template-columns:1fr;padding:24px 16px}
  .thumb{margin-top:8px}
}
@media (prefers-reduced-motion:reduce){.row{transition:none}}
.is-scrolling .row{pointer-events:none}
/* Lenis (smooth scroll), dari dist/lenis.css 1.3.27, sama seperti lab HUD */
html.lenis,html.lenis body{height:auto}
html.lenis{scroll-behavior:auto}
.lenis:not(.lenis-autoToggle).lenis-stopped{overflow:clip}
.lenis [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-smooth iframe{pointer-events:none}
main:focus{outline:none}
</style>
</head>
<body>
<a class="skip" href="#main" data-t="skip">Skip to list</a>
<div class="frame">
  <header class="bar">
    <a class="mark" href="../" data-home data-t-aria="home" aria-label="Main site">AFW</a>
    <button class="tbtn" id="lang-btn" type="button"></button>
    <button class="tbtn" id="theme-btn" type="button"></button>
  </header>
  <main id="main" tabindex="-1">
    <div class="head">
      <h1><span class="hl">Lab</span></h1>
      <p class="intro" data-t="intro"></p>
    </div>
    <ul class="list" id="list"></ul>
  </main>
  <footer class="foot">
    <a href="../" data-home data-t="back"></a>
    <span class="muted">Agung Fitrah Wibowo</span>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.27/dist/lenis.min.js" integrity="sha384-R18XzqnxvVLEF+BYfhpmDx30v7eP83fAckyfoRzK7/Uf6nGqufcmsk0eAKo7S3RU" crossorigin="anonymous"></script>
<script>
// Lenis: smooth scroll roda mouse/trackpad. Tidak dipakai bila pengguna memilih gerak dikurangi atau CDN gagal dimuat
if (window.Lenis && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  var lenis = new Lenis({ autoRaf: true, lerp: 0.1, stopInertiaOnNavigate: true })
  // "Lompat ke daftar" lewat Lenis; fokus dipindah ke <main> supaya Tab berikutnya mulai dari daftar
  document.querySelector('.skip').addEventListener('click', function (e) {
    e.preventDefault()
    var m = document.getElementById('main')
    lenis.scrollTo(m)
    m.focus({ preventScroll: true })
  })
}
// selama halaman bergerak (termasuk luncuran Lenis setelah roda berhenti), baris yang lewat di bawah kursor tidak ikut menyala;
// kelas dilepas 200ms setelah scroll terakhir, lalu hover kembali normal
;(function () {
  var t, root = document.documentElement
  addEventListener('scroll', function () {
    root.classList.add('is-scrolling')
    clearTimeout(t)
    t = setTimeout(function () { root.classList.remove('is-scrolling') }, 200)
  }, { passive: true })
})()
</script>
<script>
(function () {
  // isi lab; tanggal = commit pertama tiap lab di git
  var LABS = [
    { href: 'schema/', name: 'Schema', date: '2026-11', img: 'lab-schema.webp',
      id: 'Portofolio sebagai diagram relasi (ERD) di atas kanvas: pekerjaan, proyek, dan keahlian adalah tabel yang saling tersambung, dan menyorot satu baris menyalakan semua relasinya.',
      en: 'The portfolio as an entity-relationship diagram on a canvas: jobs, projects, and skills are linked tables, and pointing at one row lights up everything it connects to.',
      tech: 'HTML, CSS, JS · SVG' },
    { href: 'channel/', name: 'Channel', date: '2026-11', img: 'lab-channel.webp',
      id: 'Portofolio sebagai siaran TV tabung dari dasar laut: tiap bagian adalah satu channel, pindah bagian memunculkan semut dan gambar bergulung, dan airnya makin dalam sampai ke pasir.',
      en: 'The portfolio as a tube-TV broadcast from the seabed: each section is a channel, moving between them brings static and a rolling picture, and the water gets deeper until you reach the sand.',
      tech: 'HTML, CSS, JS · Three.js' },
    // img: tangkapan layar di assets/ (diisi pemilik); kalau file belum ada, kotak menampilkan label "belum ada"
    { href: 'tabloid/', name: 'Tabloid', date: '2026-11', img: 'lab-tabloid.webp',
      id: 'Portofolio sebagai satu edisi tabloid: tiap bagian adalah lembar yang dibalik saat digulir, dan pojok bawah yang tertekuk bisa diklik untuk pindah halaman.',
      en: 'The portfolio as one tabloid issue: each section is a sheet that turns as you scroll, and the folded bottom corner can be clicked to change page.',
      tech: 'HTML, CSS, JS · Lenis' },
    { href: 'poster/', name: 'Poster', date: '2026-11', img: 'lab-poster.webp',
      id: 'Portofolio sebagai poster grunge: huruf raksasa berbintik yang saling menumpuk, foto di dalam huruf, dan judul hijau vertikal yang tertahan saat digulir.',
      en: 'The portfolio as a grunge poster: giant grainy type stacked on itself, a photo inside the letters, and a green vertical title that stays pinned while you scroll.',
      tech: 'HTML, CSS, JS · Lenis' },
    { href: 'hud/', name: 'HUD', date: '2026-11', img: 'lab-hud.webp',
      id: 'Portofolio sebagai lembar referensi: garis bantu dengan crosshair, kontur topografi, dan tekstur kertas kusut dalam warna dongker dan oranye.',
      en: 'The portfolio as a reference sheet: guide lines with crosshairs, topographic contours, and crumpled paper texture in navy and orange.',
      tech: 'HTML, CSS, JS · Lenis' },
    { href: 'scroll/', name: 'Scroll', date: '2026-10', img: 'lab-scroll.webp',
      id: 'Halaman diam di tempat. Scroll memindahkan isi langkah demi langkah dan bab demi bab, di atas latar kaca beralur dari shader.',
      en: 'The page stays put. Scrolling moves the content step by step and chapter by chapter, over a fluted glass background drawn by a shader.',
      tech: 'three.js · GLSL' },
    { href: 'glass.html', name: 'Glass', date: '2026-10', img: 'lab-glass.webp',
      id: 'Bola kaca yang membiaskan teks di belakangnya, dengan panel untuk mengatur ketebalan, kekasaran, indeks bias, dan dispersi warna.',
      en: 'A glass sphere refracting the text behind it, with a panel to tune thickness, roughness, index of refraction, and color dispersion.',
      tech: 'three.js · lil-gui' }
  ]
  var T = {
    id: { skip: 'Lompat ke daftar', home: 'Situs utama', back: 'Kembali ke situs utama',
      intro: 'Percobaan tata letak dan efek di luar situs utama. Tiap lab menguji satu ide, dan belum tentu dipakai di portofolio.',
      lang: 'EN', langAria: 'Switch to English', dark: 'Gelap', light: 'Terang', toDark: 'Pakai tema gelap', toLight: 'Pakai tema terang',
      shot: 'Tangkapan layar lab ', miss: 'Belum ada tangkapan layar',
      month: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'] },
    en: { skip: 'Skip to list', home: 'Main site', back: 'Back to the main site',
      intro: 'Layout and effect experiments outside the main site. Each lab tests one idea, and not every one makes it into the portfolio.',
      lang: 'ID', langAria: 'Ganti ke Bahasa Indonesia', dark: 'Dark', light: 'Light', toDark: 'Switch to dark theme', toLight: 'Switch to light theme',
      shot: 'Screenshot of the lab ', miss: 'No screenshot yet',
      month: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] }
  }
  var root = document.documentElement, $ = function (id) { return document.getElementById(id) }
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
  var pad = function (n) { return (n < 10 ? '0' : '') + n }

  // bahasa: sama seperti situs utama. English default; ?lang=id atau pilihan tersimpan ('afw-lang') mengganti
  var lang = ''
  try { lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('afw-lang') || '' } catch (e) {}
  if (lang !== 'id' && lang !== 'en') lang = 'en'

  function render() {
    var t = T[lang]
    root.lang = lang
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.dataset.t] })
    document.querySelectorAll('[data-t-aria]').forEach(function (el) { el.setAttribute('aria-label', t[el.dataset.tAria]) })
    $('lang-btn').textContent = t.lang
    $('lang-btn').setAttribute('aria-label', t.langAria)
    syncTheme()
    // tautan lab membawa ?lang=id supaya bahasanya ikut
    var q = lang === 'id' ? '?lang=id' : ''
    document.querySelectorAll('[data-home]').forEach(function (a) { a.setAttribute('href', '../' + q) })
    $('list').innerHTML = LABS.map(function (l, i) {
      var d = l.date.split('-')
      return '<li><a class="row" href="' + l.href + q + '"><span class="no">' + pad(i + 1) + '</span>' +
        '<div><h2>' + esc(l.name) + '</h2><p>' + esc(l[lang]) + '</p>' +
        '<span class="meta muted">' + esc(l.tech) + '<br>' + t.month[+d[1] - 1] + ' ' + d[0] + '</span></div>' +
        '<span class="thumb" data-miss="' + esc(t.miss) + '"><img src="../assets/' + l.img + '" width="960" height="499" loading="lazy" alt="' + esc(t.shot + l.name) + '"></span></a></li>'
    }).join('')
    // gambar gagal / belum ada: tampilkan label di kotaknya
    document.querySelectorAll('.thumb img').forEach(function (im) {
      var miss = function () { im.parentNode.classList.add('miss') }
      if (im.complete && !im.naturalWidth) miss(); else im.addEventListener('error', miss)
    })
  }
  function syncTheme() {
    var t = T[lang], dark = root.dataset.theme === 'dark', b = $('theme-btn')
    b.textContent = dark ? t.light : t.dark
    b.setAttribute('aria-label', dark ? t.toLight : t.toDark)
  }

  $('lang-btn').addEventListener('click', function () {
    lang = lang === 'id' ? 'en' : 'id'
    try { localStorage.setItem('afw-lang', lang) } catch (e) {}
    var u = new URL(location.href)
    if (lang === 'id') u.searchParams.set('lang', 'id'); else u.searchParams.delete('lang')
    history.replaceState(null, '', u)
    render()
  })
  $('theme-btn').addEventListener('click', function () {
    var dark = root.dataset.theme !== 'dark'
    if (dark) root.dataset.theme = 'dark'; else delete root.dataset.theme
    try { localStorage.setItem('afw-theme', dark ? 'dark' : 'light') } catch (e) {}
    syncTheme()
  })
  render()
})()
</script>
</body>
</html>
