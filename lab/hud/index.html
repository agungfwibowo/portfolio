<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab: HUD · Agung Fitrah Wibowo</title>
<script>
// tema: kunci sama dengan situs utama ('afw-theme'); belum ada pilihan = ikut sistem. Dipasang sebelum render agar tidak berkedip.
try {
  const saved = localStorage.getItem('afw-theme')
  if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark'
} catch (e) {}
document.documentElement.classList.add('js')
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Arah visual: moodboard HUD terang + referensi elemen (accent line, dashline, crosshair, dash, dots, blocks).
   Barlow Semi Condensed (pilihan pemilik dari perbandingan 6 font): gaya DIN/industri, tegas tapi kalem. IBM Plex Sans: teks badan, keluarga huruf berakar teknik.
   Bentuk: foto & kontrol bersudut terpotong (bahasa HUD), screenshot berradius 18px (layar), baris tabel tanpa radius. */
:root{
  /* palet headphone Walkman: tinta biru dongker + aksen oranye busa. Oranye gagal kontras sebagai teks di latar terang (2.1:1),
     jadi di mode terang ia dipakai sebagai blok dengan teks dongker di atasnya (7.2:1). --err terpisah: warna status, bukan brand. */
  --bg:#FAFAF9;--surface:#EEF0F3;--ink:#16213F;--mute:#4A5266;
  --line:rgba(22,33,63,.12);--line-2:rgba(22,33,63,.36);
  --acc:#F39A2E;--on-acc:#16213F;--err:#C0281C;
  --dk-bg:#0C1329;--dk-ink:#E8EAF0;--dk-mute:#A3ACC2;--dk-line:rgba(232,234,240,.14);--dk-acc:#F7A440;
  --f-d:'Barlow Semi Condensed',system-ui,sans-serif;--f-b:'IBM Plex Sans',system-ui,sans-serif;
  --gut:clamp(16px,4vw,56px);--r:0px;--cut:12px;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0B1020;--surface:#161D33;--ink:#E8EAF0;--mute:#9AA3B8;
  --line:rgba(232,234,240,.12);--line-2:rgba(232,234,240,.34);
  --acc:#F7A440;--on-acc:#0B1020;--err:#FF7A6E;--dk-bg:#060A16;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
/* permukaan kertas hanya di latar; gambar, foto, tombol, dan bab dongker tetap mulus. Mode gelap = versi dongker dari foto yang sama. */

/* kertas daur ulang kusut (foto Unsplash, plufow-le-studio), dicerahkan 60% ke putih agar teks abu tetap >=5:1 di lipatan tergelap.
   Dipasang sebagai lapisan tetap selayar: halaman bergerak di atas kertas, foto tidak ditarik sepanjang halaman. */
body{background:#ECEBE9}
html:not([data-theme=dark]) body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(../../assets/kertas.webp) center/cover no-repeat}
html:not([data-theme=dark]) .nav{background:url(../../assets/kertas.webp) center/cover no-repeat fixed,#ECEBE9}
/* perangkat sentuh tidak mendukung latar fixed: header pakai warna rata-rata kertas */
@media (hover:none){html:not([data-theme=dark]) .nav{background:#ECEBE9}}
/* mode gelap: foto kertas yang sama dipetakan ke rentang dongker sempit (#070B17..#151C31), teks abu tetap >=6.6:1 */
html[data-theme=dark] body{background:#101627}
html[data-theme=dark] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(../../assets/kertas-gelap.webp) center/cover no-repeat}
html[data-theme=dark] .nav{background:url(../../assets/kertas-gelap.webp) center/cover no-repeat fixed,#101627}
@media (hover:none){html[data-theme=dark] .nav{background:#101627}}
/* cahaya lampu meja: tepi layar sedikit lebih kusam (mode terang saja) */
html:not([data-theme=dark]) body::after{content:"";position:fixed;inset:0;z-index:45;pointer-events:none;mix-blend-mode:multiply;
  background:radial-gradient(125% 95% at 50% 38%,transparent 52%,rgba(22,33,63,.06) 100%)}

html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px}
/* Lenis (smooth scroll). Dari dist/lenis.css 1.3.27; scroll-behavior bawaan dimatikan agar tidak berebut dengan Lenis */
html.lenis,html.lenis body{height:auto}
html.lenis{scroll-behavior:auto}
.lenis:not(.lenis-autoToggle).lenis-stopped{overflow:clip}
.lenis [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-smooth iframe{pointer-events:none}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--f-b);overflow-x:clip}
img{display:block;max-width:100%;height:auto}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0;padding:0}
ol,ul{list-style:none}
a{color:inherit}
a[href],button,summary,label{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:min(100% - 2*var(--gut),1240px);margin-inline:auto}
/* label kecil: huruf display, kapital, tracking sedang (bukan tracking ekstrem) */
.lbl{font:600 13px/1.3 var(--f-d);letter-spacing:.07em;text-transform:uppercase}
.lbl.m{color:var(--mute)}

.skip{position:absolute;left:12px;top:-60px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;text-decoration:none}
.skip:focus{top:12px}

/* ===== elemen visual (dari lembar "visual elements") ===== */
/* accent line: garis rambut dengan ruas pendek tegas di awal, penutup tiap kepala bab */
.aline{position:relative;height:1px;background:var(--line)}
.aline::before{content:"";position:absolute;left:0;top:-.5px;width:38px;height:2px;background:var(--ink)}
/* crosshair: titik + 4 garis, dipasang di persilangan garis bantu */
.xh{position:absolute;width:86px;height:86px;transform:translate(-50%,-50%);pointer-events:none;--c:var(--ink);
  background:radial-gradient(circle,var(--c) 2.6px,transparent 3.2px) center/100% 100% no-repeat,
  linear-gradient(var(--c),var(--c)) 50% 0/1.5px 26px no-repeat,linear-gradient(var(--c),var(--c)) 50% 100%/1.5px 26px no-repeat,
  linear-gradient(var(--c),var(--c)) 0 50%/26px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 50%/26px 1.5px no-repeat}
.xh.s{width:46px;height:46px;background-size:100% 100%,1px 12px,1px 12px,12px 1px,12px 1px}
.gh,.gv{position:absolute;background:var(--line);pointer-events:none}
.gh{height:1px}.gv{width:1px}
/* dash: dua jajaran genjang abu, dipakai sebagai pengisi sudut */
.dash{position:absolute;width:190px;height:30px;pointer-events:none}
.dash::before,.dash::after{content:"";position:absolute;top:0;height:100%;background:var(--surface);transform:skewX(-32deg)}
.dash::before{left:0;width:150px}.dash::after{left:166px;width:14px}
/* dots: tanda registrasi kecil, di beberapa titik saja (bukan latar halaman) */
.dots{position:absolute;pointer-events:none;background:radial-gradient(circle,var(--dc,var(--line-2)) 1.1px,transparent 1.6px) 0 0/16px 16px}
.dl{display:block}
/* garis bantu halaman: dua garis vertikal 28px di luar tepi konten + garis horizontal di awal tiap bab,
   crosshair di persilangannya. Ini yang membuat tata letak terasa diukur, seperti lembar referensi. */
:root{--gx:calc((100% - min(100% - 2*var(--gut),1240px))/2 - 28px)}
main{position:relative;z-index:0}
/* tirai / pintu garasi (aktif lewat JS hanya bila kontak+footer muat di layar dan perangkat ber-mouse):
   main = lembaran kertas (tanpa bayangan) di atas, kontak+footer menempel di dasar layar di bawahnya, terlihat saat main tergulung naik */
.reveal{position:relative}
.reveal #contact{padding-top:clamp(64px,7vw,104px);padding-bottom:clamp(48px,5vw,72px)}
.reveal::before,.reveal::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.reveal::before{left:var(--gx)}.reveal::after{right:var(--gx)}
html.curtain main{z-index:1;background:url(../../assets/kertas.webp) center/cover no-repeat fixed,#ECEBE9}
html.curtain[data-theme=dark] main{background:url(../../assets/kertas-gelap.webp) center/cover no-repeat fixed,#101627}
html.curtain .reveal{position:sticky;bottom:0;z-index:0;min-height:100vh;display:flex;flex-direction:column}
/* kontak setinggi layar: isi di tengah vertikal, baris hak cipta di dasar */
html.curtain .reveal #contact{flex:1;display:flex;flex-direction:column;justify-content:center}
/* header ikut terangkat bersama tirai (nilai dari JS); fokus keyboard di header memunculkannya kembali */
html.curtain .top{transform:translateY(var(--lift,0px))}
html.curtain .top:focus-within{transform:none}
main::before,main::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line);z-index:-1;pointer-events:none}
main::before{left:var(--gx)}main::after{right:var(--gx)}
.g-h{position:absolute;left:0;right:0;top:0;height:1px;background:var(--line);pointer-events:none}
.g-v{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.g-v.l{left:var(--gx)}.g-v.r{right:var(--gx)}
.g-x{top:0}.g-x.l{left:calc(var(--gx) + .5px)}.g-x.r{left:calc(100% - var(--gx) - .5px)}
.sec{overflow-x:clip}
.dark>.g-h,.dark>.g-x{top:clamp(36px,5vw,64px)}
/* di bawah 1100px jarak garis ke tepi layar terlalu sempit: yang tersisa hanya garis horizontal bab */
@media (max-width:1099px){main::before,main::after,.top::before,.top::after,.nav::before,.nav::after,.reveal::before,.reveal::after,.g-v,.g-x,.vis .xh{display:none}}

/* ===== tombol ===== */
/* outline bersudut terpotong: bentuk digambar di pseudo-element, jadi outline fokus tombolnya tidak ikut terpotong */
.cbtn{--cb:var(--bg);--ce:var(--ink);position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;font:600 13px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.cbtn::before,.cbtn::after{content:"";position:absolute;inset:0;z-index:-1;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.cbtn::before{background:var(--ce)}
.cbtn::after{inset:1.5px;background:var(--cb);clip-path:polygon(0 0,calc(100% - var(--cut) + .6px) 0,100% calc(var(--cut) - .6px),100% 100%,calc(var(--cut) - .6px) 100%,0 calc(100% - var(--cut) + .6px))}
/* outline: hover = bingkai oranye + isi oranye tipis (dicampur dengan latar agar tetap padat, bingkai di bawahnya tidak tembus) */
.cbtn:not(.fill):not(:disabled):hover,.cbtn:not(.fill):focus-visible{--ce:var(--acc);--cb:color-mix(in srgb,var(--acc) 16%,var(--bg))}
.cbtn.fill{color:var(--bg);--cb:var(--ink)}
.cbtn.fill:hover,.cbtn.fill:focus-visible{--cb:var(--acc);--ce:var(--acc);color:var(--on-acc)} /* aksen oranye di momen aksi utama */
.cbtn:active{transform:translateY(1px)}
/* tombol kurung sudut */
.bbtn{--c:var(--ink);display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 34px;font:600 13px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
  background:linear-gradient(var(--c),var(--c)) 0 0/10px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1.5px 10px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/10px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1.5px 10px no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/10px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1.5px 10px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/10px 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px 10px no-repeat;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:background-color .2s}
.bbtn:hover,.bbtn:focus-visible{--c:var(--acc);background-color:color-mix(in srgb,var(--acc) 16%,var(--bg));border-color:color-mix(in srgb,var(--acc) 55%,var(--bg))}
.bbtn:active{transform:translateY(1px)}

/* ===== header ===== */
/* header: transparan di puncak halaman; setelah scroll = kaca (satu-satunya elemen kaca di halaman) agar nav tetap terbaca di atas konten */
.top{position:sticky;top:0;z-index:40;border-bottom:1px solid transparent;background:transparent;transition:background-color .3s ease,border-color .3s ease,-webkit-backdrop-filter .3s ease,backdrop-filter .3s ease}
.top.scrolled,.top[data-menu]{--glass:rgba(236,235,233,.78);background:var(--glass);border-bottom-color:var(--line);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
html[data-theme=dark] .top.scrolled,html[data-theme=dark] .top[data-menu]{--glass:rgba(16,22,39,.78)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.top.scrolled,.top[data-menu]{--glass:#ECEBE9}html[data-theme=dark] .top.scrolled,html[data-theme=dark] .top[data-menu]{--glass:#101627}}
/* garis bantu halaman diteruskan menembus header agar menyambung dari atas sampai bawah */
.top::before,.top::after,.nav::before,.nav::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.top::before,.nav::before{left:var(--gx)}.top::after,.nav::after{right:var(--gx)}
.top .wrap{display:flex;align-items:center;gap:10px;height:68px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;padding:6px 0}
.mark b{font:700 22px/1 var(--f-d);color:var(--acc);letter-spacing:-.04em}
.mark span{font:700 11px/1.02 var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
/* tombol kecil header: saat hover/fokus/terbuka muncul kurung sudut (sama dengan tombol "Lihat proyek"), lengannya tumbuh dari 0 */
@property --k{syntax:'<length>';inherits:false;initial-value:0px}
.tbtn{--k:0px;--c:var(--ink);min-height:44px;min-width:44px;padding:0 12px;font:600 12px/1 var(--f-d);letter-spacing:.07em;text-transform:uppercase;
  background:linear-gradient(var(--c),var(--c)) 0 0/var(--k) 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1.5px var(--k) no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/var(--k) 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1.5px var(--k) no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/var(--k) 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1.5px var(--k) no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/var(--k) 1.5px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px var(--k) no-repeat;
  transition:--k .2s ease}
.tbtn:hover,.tbtn:focus-visible,.tbtn[aria-expanded=true]{--k:8px}
.tbtn:active{transform:translateY(1px)}
.menu-btn{display:inline-flex;align-items:center;gap:8px}
.top .cbtn{min-height:44px;padding:0 22px}
.nav{position:absolute;left:0;right:0;top:100%;border-bottom:1px solid var(--line);display:none}
.top[data-menu] .nav{display:block}
.nav ul{width:min(100% - 2*var(--gut),1240px);margin:0 auto;padding:12px 0 28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px}
.nav a{display:flex;flex-direction:column;gap:6px;padding:18px 0 16px;text-decoration:none;border-bottom:1px solid var(--line);font:700 clamp(22px,2.6vw,32px)/1 var(--f-d);text-transform:uppercase}
.nav a i{font:600 12px/1 var(--f-d);font-style:normal;letter-spacing:.07em;color:var(--mute)}
.nav a:hover{border-bottom-color:var(--line-2)}
.nav a[aria-current=true]{border-bottom:2px solid var(--ink);padding-bottom:15px}

/* ===== hero ===== */
.hero{position:relative;overflow:clip;padding:clamp(48px,8vw,112px) 0 clamp(56px,7vw,96px)}
.hero #hero-text{transform:translateY(var(--hy,0px));will-change:transform}
.hero-g{position:relative;z-index:0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:clamp(32px,5vw,80px);align-items:center}
.hello b{position:relative;isolation:isolate;color:var(--on-acc);font-weight:700;padding:.2em .5em;margin-left:6px}
/* label nama = stiker oranye bertepi sobek; filter hanya di lapisan latar, teksnya tetap tajam */
.hello b::before{content:"";position:absolute;inset:-1px -2px;z-index:-1;background:var(--acc);filter:url(#torn-s);transform:rotate(-1.2deg)}
.h1{margin-top:18px;font:700 clamp(42px,5.6vw,82px)/.9 var(--f-d);text-transform:uppercase;letter-spacing:-.01em}
.h1 span{display:block}
.lead{margin-top:24px;max-width:44ch;font-size:18px}
.roles{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:20px}
.roles li{color:var(--mute)}
.roles li+li::before{content:"/";margin:0 10px;color:var(--line-2)}
.acts{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.facts{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:16px clamp(28px,4vw,56px);margin-top:44px}
.facts dd{margin-top:6px;font:600 18px/1.2 var(--f-d)}

.vis{position:relative;width:100%;min-height:clamp(280px,32vw,460px)}
.topo{position:absolute;z-index:-1;left:50%;top:50%;width:min(1000px,130vw);transform:translate(-50%,calc(-50% + var(--tpy,0px)));color:var(--line);pointer-events:none}
.topo path{fill:none;stroke:currentColor;stroke-width:1;vector-effect:non-scaling-stroke}
.topo .ix{stroke:var(--line-2)}
.topo .ring{stroke:var(--line-2);stroke-dasharray:3 5}
.vis .gh{left:40%;right:-100vw;top:46%}
.vis .xh{left:calc(100% + 27.5px);top:46%} /* tepat di garis bantu kanan halaman (28px di luar konten) */
/* foto bersudut terpotong (kanan-atas & kiri-bawah) */
.cut{clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,30px 100%,0 calc(100% - 30px))}
.photo{position:relative;width:clamp(200px,17vw,250px)}
/* foto potongan (latar transparan) di atas pelat gelap, seperti foto tim di referensi; di mode gelap pelat sedikit lebih terang agar tetap terpisah dari halaman */
.photo{--plate:#0D1530}
html[data-theme=dark] .photo{--plate:#05070D}
.photo img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 20%;background:var(--plate);filter:brightness(.8) contrast(1.2)}
.photo .lbl{position:absolute;z-index:1;right:20px;bottom:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.vname{writing-mode:vertical-rl;transform:rotate(180deg);font:700 clamp(32px,3.2vw,48px)/.86 var(--f-d);text-transform:uppercase;letter-spacing:-.01em}
.vname span{display:block}
/* foto di ruang kosong kiri-bawah bab pengalaman (sisa tangga langkah) */
.who{position:relative;display:flex;align-items:flex-end;gap:14px;margin-top:clamp(40px,6vw,72px)}
.who .dots{z-index:2;--dc:#8A8D93;width:62px;height:126px;left:-30px;bottom:44px}
.hero>.dash{left:-40px;bottom:36px}

/* ===== kepala bab ===== */
.sec{position:relative;padding:clamp(88px,11vw,160px) 0 clamp(72px,9vw,128px)} /* jarak bawah: isi bab tidak menempel ke garis bab berikutnya */
/* gaya A: garis + "02" + judul besar dua baris */
.sha{display:grid;grid-template-columns:clamp(72px,12vw,150px) 1fr auto;align-items:start;gap:16px;margin-bottom:28px}
.sha .no{display:flex;align-items:center;gap:10px;padding-top:.7em;font:600 12px/1 var(--f-d);letter-spacing:.07em;color:var(--mute)}
.sha .no::before{content:"";width:30px;height:1px;background:var(--line-2);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.sha h2{font:700 clamp(36px,5.8vw,76px)/.9 var(--f-d);text-transform:uppercase;letter-spacing:-.01em}
.sha h2 span{display:block}
.sha .meta{padding-top:.7em}
/* gaya B: nomor raksasa + label kecil di sudut kanan-atasnya */
.shb{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px}
.shb .big{font:700 clamp(88px,11vw,150px)/.78 var(--f-d);letter-spacing:-.03em}
.shb h2{max-width:14ch;font:700 clamp(16px,1.6vw,20px)/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.01em}
.shb .meta{margin-left:auto;align-self:flex-end}

/* ===== proyek ===== */
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 64px;align-items:end;margin:clamp(40px,6vw,72px) auto 32px}
.idx b{color:var(--ink);font-weight:600}
.feat h3{margin-top:10px;font:700 clamp(30px,4vw,50px)/1 var(--f-d);text-transform:uppercase}
.feat .desc{color:var(--mute);max-width:52ch}
.feat .cbtn{margin-top:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin-top:18px;font-size:15px}
.kv dt{padding-top:.2em}
.strip-w{position:relative;container-type:inline-size} /* lebar slide (cqw) dihitung dari lebar slider, bukan ruang konten yang sudah dikurangi padding */
/* desktop: slider melebar sampai garis bantu (28px di luar container), slide samping terpotong tepat di garis; 1px di dalam garis agar garisnya tetap tampak */
@media (min-width:1100px){.wrap.strip-w{width:min(100% - 2*var(--gut) + 54px,1294px)}}
/* slider di dalam container (garis bantu halaman tidak tembus di belakang slide transparan).
   Scroll-snap bawaan (swipe HP tetap mulus) + kontrol JS. Padding samping = setengah sisa lebar,
   jadi slide pertama & terakhir juga bisa berada di tengah (seperti centeredSlides). */
.strip{--sw:min(78cqw,1040px);display:flex;gap:clamp(20px,4.5vw,72px);overflow-x:auto;scroll-snap-type:x mandatory;padding:16px calc((100% - var(--sw))/2) 20px;scrollbar-width:none;cursor:grab;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.strip.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}
/* fokus keyboard: outline selebar layar diganti bingkai di slide aktif (figure tidak ter-clip, jadi outline utuh) */
.strip:focus-visible{outline:none}
.strip:focus-visible figure.on{outline:2px solid var(--ink);outline-offset:8px}
.strip figure{position:relative;flex:0 0 var(--sw);scroll-snap-align:center;transition:opacity .4s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.strip figure:not(.on){opacity:.5;transform:scale(.94)}
.strip figure:not(.on) img{filter:grayscale(1)}
.strip img{-webkit-user-drag:none;user-select:none}
.sl-ctl{display:flex;align-items:center;gap:20px;margin-top:8px}
.sl-dots{display:flex;gap:6px}
.sl-dot{position:relative;width:44px;height:44px}
.sl-dot::before{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px;background:var(--line-2);transition:background-color .2s,height .2s}
.sl-dot:hover::before{background:var(--mute)}
.sl-dot[aria-current=true]::before{background:var(--ink);height:4px;margin-top:-2px}
.sl-n{margin-left:auto}
.sl-n b{font-weight:600}
.sl-btns{display:flex;gap:10px}
.sl-b{width:52px;padding:0}
.sl-b svg{display:block}
.sl-b:disabled{opacity:.35}
.strip figcaption{margin-top:12px}
/* sudut screenshot dipotong seperti foto profil; tanpa border karena diagonalnya tidak bisa ikut bergaris */
.shot.cut2{border:0;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.strip-w .dots{z-index:2;--dc:#8A8D93;right:40px;top:-26px;width:94px;height:78px}
.shot{position:relative;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:clip}
.shot img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:50% 0;position:relative}
.shot .st{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font:600 11px/1 var(--f-d);letter-spacing:.07em;text-transform:uppercase}
.shot.err img{visibility:hidden}
.grid{display:grid;grid-template-columns:1fr;gap:56px;margin-top:clamp(56px,8vw,112px)}
.card{position:relative}
/* paralaks (nilai dari JS, desktop + mouse saja): foto bergeser di dalam bingkainya, teks bergeser berlawanan sehingga judul tampak mengambang */
.card .shot img{transform:translateY(var(--py,0px)) scale(var(--ps,1))}
.card h3,.card .card-m,.card .tools-l{transform:translateY(var(--ty,0px))}
/* tombol tampil semua: di tengah bawah grid; saat terbuka ia menempel di bawah layar selama grid di-scroll */
.more{display:flex;justify-content:center;margin-top:clamp(48px,6vw,80px);z-index:5}
.more[data-open]{position:sticky;bottom:16px}
.more[data-open] .bbtn{background-color:var(--bg)}
.more[data-open] .bbtn:hover,.more[data-open] .bbtn:focus-visible{background-color:color-mix(in srgb,var(--acc) 16%,var(--bg))}
.more .bbtn span{margin-left:10px;color:var(--mute)}
.pl{position:relative}
.card-m{display:flex;justify-content:space-between;gap:12px;margin-top:12px}
/* judul kartu menimpa tepi bawah screenshot (seperti panel "Onboarding" di referensi); pita latar = label tempel, jadi tetap terbaca */
.card h3{position:relative;z-index:1;margin-top:calc(-.62em - 4px);padding-left:0;font:700 clamp(24px,2.7vw,36px)/1.05 var(--f-d);text-transform:uppercase}
/* tanpa pita latar (permintaan); halo tipis warna kertas di sekeliling huruf menjaga keterbacaan saat menimpa screenshot gelap */
.card .ttl{text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 14px var(--bg),0 0 24px var(--bg)}
.card-btn{text-align:left;text-transform:inherit}
.card{cursor:pointer}
.card-btn:focus-visible{outline:0}
.card:has(.card-btn:focus-visible) .pl{outline:2px solid var(--ink);outline-offset:4px}
.card .tools-l{margin-top:6px;color:var(--mute);font-size:14px}
/* screenshot hitam-putih, berwarna saat hover/fokus; hanya di perangkat yang punya hover agar layar sentuh tetap melihat warna. Dialog detail selalu berwarna. */
@media (hover:hover){
  .card .shot img{filter:grayscale(1);transition:filter .4s ease}
  .card:hover .shot img,.card:has(.card-btn:focus-visible) .shot img{filter:none}
}
.card:active .shot{transform:scale(.995)}
.card:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}

/* ===== pengalaman: baris proses bertangga ===== */
.steps{margin-top:clamp(40px,6vw,72px)}
.step{display:grid;grid-template-columns:clamp(64px,8vw,96px) minmax(0,1fr) minmax(0,1fr);gap:12px 40px;align-items:start;padding:clamp(28px,4vw,44px) 0}
.step .no{display:flex;align-items:center;gap:10px;padding-top:.9em;font:600 12px/1 var(--f-d);letter-spacing:.07em}
.step .no::before{content:"";width:22px;height:1px;background:var(--line-2)}
.step h3{text-wrap:balance;overflow-wrap:anywhere;font:700 clamp(28px,3.7vw,54px)/.92 var(--f-d);text-transform:uppercase;letter-spacing:-.01em}
.step h3 span{display:block}
.step .when{margin-top:12px}
/* kotak merah = penanda status nyata: pekerjaan yang masih berjalan */
.step.now .when::before{content:"";display:inline-block;width:8px;height:8px;background:var(--acc);margin-right:8px;vertical-align:1px}
.step .r{margin-top:4px;color:var(--mute);font-size:15px}
.step .d{max-width:48ch;font-size:15px;padding-top:.4em}

/* ===== keahlian: bab gelap + grid blocks ===== */
.dark{--ink:var(--dk-ink);--mute:var(--dk-mute);--line:var(--dk-line);--line-2:rgba(232,234,240,.34);--acc:var(--dk-acc);--surface:#1E2A4D;--bg:var(--dk-bg);
  position:relative;margin-top:0;padding:clamp(72px,9vw,128px) 0;background:var(--dk-bg);color:var(--ink);overflow:clip}
.dark :focus-visible{outline-color:var(--ink)}
.dk-h{display:grid;grid-template-columns:auto minmax(0,1.2fr) minmax(0,.8fr);gap:24px clamp(24px,5vw,72px);align-items:start}
.dk-h h2{font:700 clamp(36px,5.8vw,76px)/.9 var(--f-d);text-transform:uppercase;letter-spacing:-.01em}
.dk-h h2 span{display:block}
.dk-h p{max-width:36ch;padding-top:.5em}
.dk-h p .lbl{display:block;margin-top:12px}
.blk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:clamp(48px,7vw,88px);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{position:relative;display:flex;gap:22px;padding:clamp(28px,3.4vw,44px) clamp(20px,2.6vw,36px);border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:260px}
.cell::before,.cell::after,.cell .dt{content:"";position:absolute;z-index:1;width:5px;height:5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 8px var(--bg)}
.cell::before{left:-3px;top:-3px}
.cell::after{right:-3px;top:-3px}
.cell .dt.bl{left:-3px;bottom:-3px}.cell .dt.br{right:-3px;bottom:-3px}
.cell .vl{align-self:flex-start;writing-mode:vertical-rl;transform:rotate(180deg);font:700 18px/1 var(--f-d);text-transform:uppercase;letter-spacing:.01em;flex:none}
.cell .vl i{font:600 11px/1 var(--f-d);font-style:normal;letter-spacing:.07em;color:var(--mute);margin-bottom:12px}
.cell ul{flex:1;min-width:0}
.cell li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-weight:500}
.cell li:first-child{padding-top:0}
.cell li i{font:600 11px/1.6 var(--f-d);font-style:normal;letter-spacing:.07em;color:var(--mute)}

/* ===== kontak ===== */
.ct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px clamp(40px,7vw,120px);align-items:start}
.ct-no{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.ct-no .no{display:flex;align-items:center;gap:10px}
.ct-no .no::before{content:"";width:30px;height:1px;background:var(--line-2);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.ct-t{font:700 clamp(40px,6.4vw,88px)/.9 var(--f-d);text-transform:uppercase;letter-spacing:-.01em}
.ct-t span{display:block}
/* pita oranye lebih pendek dari tinggi baris, supaya baris yang bertumpuk tidak saling tertutup */
.ct-t .hl{margin-top:.08em;line-height:1}
.ct-t .hl i{font-style:normal;color:var(--on-acc);background:linear-gradient(var(--acc),var(--acc)) 0 var(--bp,58%)/100% .94em no-repeat;padding:0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ct-p{margin-top:24px;max-width:44ch;font-size:17px}
.cl{display:grid;gap:26px;padding-top:clamp(8px,2.6vw,36px)} /* kolom kanan: pengganti form */
.cl a{display:inline-flex;align-items:center;min-height:44px;font:600 clamp(18px,2vw,22px)/1.2 var(--f-d);text-transform:uppercase;text-decoration:none;overflow-wrap:anywhere}
.cl a:hover{text-decoration:underline;text-underline-offset:4px}
.cl .v{display:block;margin-top:2px;font:600 clamp(18px,2vw,22px)/1.2 var(--f-d);text-transform:uppercase}

/* footer ikut sistem garis: garis horizontal selebar layar + crosshair, garis vertikal diteruskan sampai dasar halaman */
.foot{position:relative;overflow-x:clip;margin-top:0;padding:clamp(28px,3vw,40px) 0 clamp(28px,3vw,40px)}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.foot-id{display:flex;align-items:center;gap:12px;margin-right:auto}
.foot-id b{font:700 18px/1 var(--f-d);color:var(--acc);letter-spacing:-.04em}
.foot nav{display:flex;flex-wrap:wrap;gap:4px 8px}
.foot .tbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}

/* ===== dialog proyek ===== */
/* dialog: kurung sudut seperti tombol "Lihat proyek". Dialog sendiri tidak di-scroll (hanya .pd-b),
   supaya kurung yang menempel di sudut tidak ikut tergulir. */
dialog{--c:var(--ink);width:min(100% - 24px,1100px);max-height:calc(100dvh - 24px);padding:0;overflow:visible;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
dialog[open]{display:flex;flex-direction:column}
dialog::after{content:"";position:absolute;inset:-1px;pointer-events:none;z-index:2;
  background:linear-gradient(var(--c),var(--c)) 0 0/22px 2px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/2px 22px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/22px 2px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/2px 22px no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/22px 2px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/2px 22px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/22px 2px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/2px 22px no-repeat}
dialog::backdrop{background:rgba(15,16,18,.6)}
.pd-h{flex:none;display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.pd-h h2{font:700 clamp(22px,3vw,34px)/1.05 var(--f-d);text-transform:uppercase}
.pd-h .idx{margin-bottom:4px}
.pd-h .cbtn{margin-left:auto;flex:none}
.pd-b{min-height:0;overflow:auto;overscroll-behavior:contain;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:28px;padding:24px 20px 28px}
.pd-b .kv{margin-top:0;align-self:start;position:sticky;top:0}
.pd-s{display:grid;gap:20px}

.state{padding:120px 0;max-width:52ch}
.state h1{font:700 34px/1.05 var(--f-d);text-transform:uppercase}
.state p{margin:12px 0 22px;color:var(--mute)}

/* ===== gerak: sekali saat bab masuk layar, menandai pergantian bab ===== */
.js .rv .no::before{transform:scaleX(0)}
.js .rv.in .no::before{transform:none}
.js .card.rv,.js .step.rv{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js .card.rv.in,.js .step.rv.in{opacity:1;transform:none}
/* transisi dari video referensi, diterjemahkan ke scroll (sekali, saat bagian masuk layar):
   judul naik dari balik masker per baris, accent line ditarik dari kiri, isi muncul bertahap */
.js .mk{display:block;overflow:clip;padding-bottom:.08em;margin-bottom:-.08em}
.js .mk>span{display:block;transform:translateY(112%);transition:transform 1s cubic-bezier(.19,.8,.2,1) var(--d,0s)}
.js .rv.in .mk>span{transform:none}
.js .rv-f{opacity:0;transform:translateY(16px);transition:opacity .7s ease var(--d,0s),transform .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.js .rv.in .rv-f{opacity:1;transform:none}
.js .hero .topo{opacity:0;transition:opacity 1.8s ease .4s}
.js .hero.in .topo{opacity:1}
.js .aline.rv{transform:scaleX(0);transform-origin:left;transition:transform 1.1s cubic-bezier(.2,.7,.2,1) .1s}
.js .aline.rv.in{transform:none}
/* bab gelap: dashline digambar garis demi garis, lalu judul, teks, dan sel blocks satu per satu */
.js .dk-h.rv .dl rect{transform:scaleX(0);transform-box:fill-box;transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1) calc(var(--i) * .045s)}
.js .dk-h.rv.in .dl rect{transform:none}
.js .dk-h.rv>p{opacity:0;transition:opacity .8s ease .55s}
.js .dk-h.rv.in>p{opacity:1}
.js .blk.rv .cell{opacity:0;transform:translateY(24px);transition:opacity .6s ease calc(.15s + var(--i) * .12s),transform .7s cubic-bezier(.2,.7,.2,1) calc(.15s + var(--i) * .12s)}
.js .blk.rv.in .cell{opacity:1;transform:none}
/* pengganti sapuan diagonal: tepi atas & bawah bab gelap miring lalu rata mengikuti scroll (nilai dari JS) */
.dark{clip-path:polygon(0 0,100% var(--tr,0px),100% 100%,0 calc(100% - var(--bl,0px)))}
@media (prefers-reduced-motion:reduce){
  .js .mk>span,.js .rv-f,.js .aline.rv,.js .dk-h.rv .dl rect,.js .blk.rv .cell{transform:none!important;opacity:1!important}
  .js .hero .topo,.js .dk-h.rv>p{opacity:1!important}
  .dark{clip-path:none}
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important}
  .js .card.rv,.js .step.rv{opacity:1;transform:none}
  .js .rv .no::before{transform:none}
}

/* ===== lebar menengah ===== */
@media (min-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;row-gap:64px}
}
@media (min-width:1024px){
  .grid{column-gap:clamp(48px,7vw,120px);row-gap:72px}
  .grid .card:nth-child(even){margin-top:140px}
  /* foto proyek melebar: ke luar 54px (menyeberang garis bantu), dibatasi agar selalu tersisa 8px dari tepi layar; ke dalam 24px; teks tetap lurus kolom */
  .grid{--out:calc(-1 * min(54px,(100vw - min(100vw - 2 * var(--gut),1240px)) / 2 - 8px))}
  .grid .card:nth-child(odd) .pl{margin-left:var(--out);margin-right:-24px}
  .grid .card:nth-child(even) .pl{margin-right:var(--out);margin-left:-24px}
  /* tangga: tiap langkah bergeser ke kanan, seperti lembar proses di referensi */
  .step:nth-child(2){margin-left:10%}.step:nth-child(3){margin-left:20%}.step:nth-child(4){margin-left:30%}.step:nth-child(5){margin-left:40%}
  .exp-g{position:relative}
  .exp-g .who{position:absolute;z-index:1;left:0;bottom:clamp(28px,4vw,44px);margin:0}
  .step:nth-child(n+3) .d{grid-column:2/-1}
  .step:nth-child(n+3){grid-template-columns:clamp(64px,8vw,96px) minmax(0,1fr)}
}
@media (max-width:1023px){
  .hero-g{grid-template-columns:minmax(0,1fr) minmax(0,.7fr)}
  .step{grid-template-columns:clamp(56px,8vw,80px) minmax(0,1fr)}
  .step .d{grid-column:2}
  .blk{grid-template-columns:repeat(2,minmax(0,1fr))}
  .blk .cell:nth-child(3){grid-column:1/-1}
  .dk-h{grid-template-columns:auto minmax(0,1fr)}
  .dk-h p{grid-column:2}
  .nav ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ===== HP ===== */
@media (max-width:760px){
  body{font-size:15px}
  .strip{--sw:86cqw}
  .top .wrap{height:60px}
  .top .cbtn{display:none}
  .hero-g{grid-template-columns:1fr}
  .vis{min-height:200px}
  .photo{width:min(60vw,250px)}
  .facts{grid-template-columns:1fr 1fr}
  .sha{grid-template-columns:1fr auto;gap:12px}
  .sha .no{grid-column:1/-1;padding-top:0}
  .sha .meta{padding-top:0;align-self:end}
  .shb .big{font-size:84px}
  .feat{grid-template-columns:1fr}
  .step{grid-template-columns:44px minmax(0,1fr);gap:10px 14px}
  .dk-h{grid-template-columns:1fr}
  .dk-h p{grid-column:1}
  .dk-h .dl{display:none}
  .blk{grid-template-columns:1fr}
  .cell{min-height:0;flex-direction:column;gap:16px}
  .cell .vl{writing-mode:horizontal-tb;transform:none;display:flex;align-items:baseline;gap:10px}
  .cell .vl i{margin:0}
  .ct{grid-template-columns:1fr}
  .nav ul{grid-template-columns:1fr;padding-bottom:16px}
  .nav a{flex-direction:row;align-items:baseline;gap:12px;padding:14px 0}
  .pd-b{grid-template-columns:1fr;padding:18px 16px 22px}
  .pd-b .kv{position:static}
  .pd-h{padding:14px 16px}
}
</style>
</head>
<body>
<!-- filter tepi sobek untuk label nama: noise menggeser tepi bentuk (displacement) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="torn-s" x="-10%" y="-25%" width="120%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="3" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<a class="skip" href="#main" id="skip">Skip to content</a>

<header class="top" id="top-bar">
  <div class="wrap">
    <a class="mark" href="#profile" id="mark">
      <b aria-hidden="true">//</b>
      <span>Agung<br>Fitrah<br>Wibowo</span>
    </a>
    <div class="tools">
      <button class="tbtn" id="lang-btn" type="button">ID</button>
      <button class="tbtn" id="theme-btn" type="button">Dark</button>
      <a class="cbtn" id="cta-top" href="#contact">Contact</a>
      <button class="tbtn menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 4v6M7 1v12M13 4v6" stroke="currentColor" stroke-width="1.6"/></svg><span id="menu-l">Menu</span>
      </button>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Main"><ul id="nav-list"></ul></nav>
</header>

<main id="main">
  <section class="hero rv" id="profile" aria-labelledby="h1">
    <span class="dash" aria-hidden="true"></span>
    <div class="wrap">
      <div class="hero-g">
        <div id="hero-text">
          <h1 class="h1" id="h1"><span>Front-End Developer</span><span>&amp; UI/UX Designer</span></h1>
        </div>
        <div class="vis">
          <svg class="topo" id="topo" viewBox="0 0 900 600" aria-hidden="true" focusable="false"></svg>
          <span class="gh" aria-hidden="true"></span><span class="xh" aria-hidden="true"></span>

// status gambar: label "memuat" di belakang gambar, berganti pesan kalau gagal
function wireImages(scope) {
  scope.querySelectorAll('.shot img').forEach(img => {
    const box = img.parentNode, st = box.querySelector('.st')
    const fail = () => { box.classList.add('err'); st.textContent = t.broken }

    img.addEventListener('error', fail, { once: true })
  })

// ---- slider strip Faria: tombol, penanda, panah keyboard, drag mouse; swipe sentuh memakai scroll bawaan
let sl = null
function slider() {
  const s = $('strip')
  if (!s) return
  const figs = [...s.querySelectorAll('figure')], dots = [...document.querySelectorAll('.sl-dot')]
  const prev = $('sl-prev'), next = $('sl-next'), curEl = $('sl-cur')
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  let cur = -1, lock = 0
  const nearest = () => {
    const sr = s.getBoundingClientRect(), c = sr.left + sr.width / 2
    let best = 0, d = Infinity
    figs.forEach((f, i) => { const r = f.getBoundingClientRect(), dd = Math.abs(r.left + r.width / 2 - c); if (dd < d) { d = dd; best = i } })
    return best
  }
  const go = (i, smooth = true) => {
    i = Math.max(0, Math.min(figs.length - 1, i))
    const sr = s.getBoundingClientRect(), r = figs[i].getBoundingClientRect()
    lock = Date.now() + 600 // selama scroll otomatis, posisi sementara tidak boleh mengganti slide aktif
    s.scrollTo({ left: s.scrollLeft + (r.left + r.width / 2) - (sr.left + sr.width / 2), behavior: smooth && !reduce ? 'smooth' : 'auto' })
    set(i)
  }
  const set = i => {
    if (i === cur) return
    cur = i
    figs.forEach((f, k) => f.classList.toggle('on', k === i))
    dots.forEach((d, k) => k === i ? d.setAttribute('aria-current', 'true') : d.removeAttribute('aria-current'))
    prev.disabled = i === 0
    next.disabled = i === figs.length - 1
    curEl.textContent = pad(i + 1)
  }
  let raf = 0
  s.addEventListener('scroll', () => { if (!drag && Date.now() > lock) { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => set(nearest())) } }, { passive: true })
  prev.addEventListener('click', () => go(cur - 1))
  next.addEventListener('click', () => go(cur + 1))
  dots.forEach(d => d.addEventListener('click', () => go(+d.dataset.go)))
  s.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1) }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1) }
  })
  // drag mouse: geser bebas, lalu lepas = loncat ke slide terdekat (atau ke sebelahnya bila tarikan > 60px)
  let drag = null
  s.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return
    drag = { x: e.clientX, left: s.scrollLeft, from: cur, moved: 0 }
    s.setPointerCapture(e.pointerId)
    s.classList.add('drag')
  })
  s.addEventListener('pointermove', e => {
    if (!drag) return
    drag.moved = e.clientX - drag.x
    s.scrollLeft = drag.left - drag.moved
  })
  const end = () => {
    if (!drag) return
    const { moved, from } = drag
    drag = null
    s.classList.remove('drag')
    let i = nearest()
    if (i === from && Math.abs(moved) > 60) i = from + (moved < 0 ? 1 : -1)
    cur = -1
    go(i)
  }
  s.addEventListener('pointerup', end)
  s.addEventListener('pointercancel', end)
  sl = { go: () => go(cur, false) }
  // mulai di slide tengah supaya ketiga produk terlihat, seperti sebelumnya
  requestAnimationFrame(() => go(Math.floor((figs.length - 1) / 2), false))
}
addEventListener('resize', () => { if (sl) sl.go() })

// ---- dialog proyek (Escape bawaan <dialog>, klik di luar juga menutup)
const dlg = $('pd')
let opener = null
document.addEventListener('click', e => {
  let b = e.target.closest('button[data-open]')
  // klik di mana saja pada kartu = buka detail; tombol judul tetap kontrol untuk keyboard
  if (!b) { const c = e.target.closest('.card'); if (c && !e.target.closest('a,button')) b = c.querySelector('button[data-open]') }
  if (!b) return
  const i = +b.dataset.open, p = D.projects[i], U = D.ui
  opener = b
  $('pd-i').innerHTML = `<b>[${pad(i + 1)}/${pad(D.projects.length)}]</b> ${esc(p.cat)}`
  $('pd-t').textContent = p.name
  $('pd-kv').innerHTML = [[U.client, p.client], [U.role, p.role], [U.tools, p.tools], [t.shots, String(p.imgs.length)]]
    .map(([k, v]) => `<dt class="lbl m">${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')
  $('pd-s').innerHTML = p.imgs.map((img, k) => shot(img, `${p.name}, ${k ? U.view + ' ' + (k + 1) : U.mainView}`, k > 0, true)).join('')
  wireImages($('pd-s'))
  dlg.showModal()
  if (lenis) lenis.stop()
  dlg.querySelector('.pd-b').scrollTop = 0
})
$('pd-x').addEventListener('click', () => dlg.close())
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close() })
dlg.addEventListener('close', () => { if (lenis) lenis.start(); if (opener && opener.isConnected) opener.focus() })

// ---- menu (semua lebar layar, seperti referensi): label "Menu" selalu terlihat
const bar = $('top-bar'), menuBtn = $('menu-btn')
function setMenu(open, focusFirst) {
  if (open) bar.setAttribute('data-menu', ''); else bar.removeAttribute('data-menu')
  menuBtn.setAttribute('aria-expanded', String(open))
  if (open && focusFirst) { const a = document.querySelector('#nav-list a'); if (a) a.focus() }
}
menuBtn.addEventListener('click', e => setMenu(!bar.hasAttribute('data-menu'), e.detail === 0))
$('nav').addEventListener('click', e => { if (e.target.closest('a')) setMenu(false) })
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && bar.hasAttribute('data-menu')) { setMenu(false); menuBtn.focus() }
})
document.addEventListener('click', e => { if (bar.hasAttribute('data-menu') && !bar.contains(e.target)) setMenu(false) })

// ---- bahasa & tema
$('lang-btn').addEventListener('click', () => {
  lang = lang === 'id' ? 'en' : 'id'
  try { localStorage.setItem('afw-lang', lang) } catch (e) {}
  const u = new URL(location.href)
  if (lang === 'id') u.searchParams.set('lang', 'id'); else u.searchParams.delete('lang')
  history.replaceState(null, '', u)
  render()
  $('lang-btn').focus()
})
function syncThemeBtn() {
  const dark = root.dataset.theme === 'dark', b = $('theme-btn')
  b.textContent = dark ? t.light : t.dark
  b.setAttribute('aria-label', dark ? t.toLight : t.toDark)
}
$('theme-btn').addEventListener('click', () => {
  const dark = root.dataset.theme !== 'dark'
  if (dark) root.dataset.theme = 'dark'; else delete root.dataset.theme
  try { localStorage.setItem('afw-theme', dark ? 'dark' : 'light') } catch (e) {}
  syncThemeBtn()
})

// ---- penanda bab aktif di menu + reveal sekali
let io, navIo
function observe() {
  if (io) io.disconnect()
  if (navIo) navIo.disconnect()
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.rv').forEach(el => el.classList.add('in')); return }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) }
  }), { rootMargin: '0px 0px -10% 0px' })
  document.querySelectorAll('.rv').forEach(el => reduce ? el.classList.add('in') : io.observe(el))
  const links = [...document.querySelectorAll('#nav-list a')]
  navIo = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting || (e.target.id === 'contact' && root.classList.contains('curtain'))) return
    links.forEach(a => a.getAttribute('href') === '#' + e.target.id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'))
  }), { rootMargin: '-45% 0px -50% 0px' })
  document.querySelectorAll('main > section, #contact').forEach(s => navIo.observe(s))
}

// ---- garis kontur: medan acak ber-seed + marching squares, digambar sekali
function topo() {
  let s = 20191104
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let x = Math.imul(s ^ s >>> 15, 1 | s); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296 }
  const W = 90, H = 60, K = 10
  const bumps = Array.from({ length: 6 }, (_, i) => ({ x: i ? 10 + rnd() * 70 : 46, y: i ? 6 + rnd() * 48 : 30, s: 7 + rnd() * 13, a: i ? (rnd() - .35) * 1.4 : 1.6 }))
  const F = []
  let lo = Infinity, hi = -Infinity
  for (let y = 0; y <= H; y++) {
    const row = []
    for (let x = 0; x <= W; x++) {
      let v = .18 * Math.sin(x * .09 + y * .05) + .12 * Math.cos(y * .11 - x * .03)
      bumps.forEach(b => { v += b.a * Math.exp(-((x - b.x) ** 2 + (y - b.y) ** 2) / (2 * b.s * b.s)) })
      row.push(v); lo = Math.min(lo, v); hi = Math.max(hi, v)
    }
    F.push(row)
  }
  const SEG = [[], [[3, 2]], [[2, 1]], [[3, 1]], [[0, 1]], [[3, 0], [2, 1]], [[0, 2]], [[3, 0]], [[3, 0]], [[0, 2]], [[0, 1], [3, 2]], [[0, 1]], [[3, 1]], [[2, 1]], [[3, 2]], []]
  const L = 16
  let out = ''
  for (let l = 1; l < L; l++) {
    const lv = lo + (hi - lo) * l / L
    let d = ''
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const a = F[y][x], b = F[y][x + 1], c = F[y + 1][x + 1], e = F[y + 1][x]
      const idx = (a > lv) * 8 + (b > lv) * 4 + (c > lv) * 2 + (e > lv)
      if (!SEG[idx].length) continue
      const pt = k => k === 0 ? [x + (lv - a) / (b - a), y] : k === 1 ? [x + 1, y + (lv - b) / (c - b)] : k === 2 ? [x + (lv - e) / (c - e), y + 1] : [x, y + (lv - a) / (e - a)]
      SEG[idx].forEach(([p, q]) => {
        const A = pt(p), B = pt(q)
        d += `M${(A[0] * K).toFixed(1)} ${(A[1] * K).toFixed(1)}L${(B[0] * K).toFixed(1)} ${(B[1] * K).toFixed(1)}`
      })
    }
    // setiap kontur ke-4 lebih tegas, seperti garis indeks di peta topografi
    out += `<path${l % 4 === 0 ? ' class="ix"' : ''} d="${d}"/>`
  }
  const px = bumps[0].x * K, py = bumps[0].y * K
  out += `<path class="ring" d="M${px - 140} ${py}a140 140 0 1 0 280 0a140 140 0 1 0 -280 0"/>`
  $('topo').innerHTML = out
}

function showError() {
  const l = (navigator.language || '').startsWith('id') ? 'id' : 'en', e = T[l].err
  document.getElementById('main').innerHTML =
    `<div class="wrap state" role="alert"><h1>${e[0]}</h1><p>${e[1]}</p><div class="acts"><button class="cbtn fill" type="button" onclick="location.reload()">${e[2]}</button><a class="bbtn" href="${BASE}">${T[l].main}</a></div></div>`
  document.getElementById('top-bar').hidden = true
}

// ---- Lenis: smooth scroll roda mouse/trackpad. Tidak dipakai bila pengguna memilih gerak dikurangi atau CDN gagal dimuat.
// allowNestedScroll: area yang bisa di-scroll sendiri (slider, isi dialog) tetap memakai scroll-nya sendiri.
let lenis = null
if (window.Lenis && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  lenis = new Lenis({ autoRaf: true, lerp: 0.1, allowNestedScroll: true, stopInertiaOnNavigate: true })
  // tautan #bab lewat Lenis + offset header; fokus dipindah ke tujuan agar "Lewati ke konten" tetap berguna bagi keyboard
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]')
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey) return
    const id = a.getAttribute('href').slice(1), el = id && document.getElementById(id)
    if (!el) return
    e.preventDefault()
    // fokus dipindah langsung (onComplete tidak terpanggil bila tidak ada jarak yang perlu di-scroll)
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1')
    el.focus({ preventScroll: true })
    // offset header sudah dihitung Lenis dari scroll-padding-top di <html>, jadi tidak ditambah lagi.
    // Saat tirai aktif, kontak menempel (sticky) sehingga posisinya terbaca salah: tujuannya = dasar halaman.
    if (inCurtain(el)) lenis.scrollTo(document.documentElement.scrollHeight)
    else lenis.scrollTo(el)
    history.replaceState(null, '', '#' + id)
  })
}

// ---- header kaca setelah halaman di-scroll
function topState() { $('top-bar').classList.toggle('scrolled', scrollY > 8) }
addEventListener('scroll', topState, { passive: true })

// ---- tirai: hidup hanya bila kontak+footer muat di layar dan perangkat punya mouse (latar fixed tidak didukung di layar sentuh)
const inCurtain = el => root.classList.contains('curtain') && !!el.closest('#reveal')
function curtain() {
  const r = $('reveal')
  if (!r) return
  root.classList.toggle('curtain', matchMedia('(hover:hover)').matches && r.offsetHeight <= innerHeight)
  curtainNav()
}
addEventListener('resize', curtain)
// penanda menu saat tirai aktif: kontak sudah "ada" di layar sejak awal (tertutup tirai), jadi tandai dari posisi tirai
function curtainNav() {
  const top = $('top-bar')
  if (!root.classList.contains('curtain')) { top.style.removeProperty('--lift'); return }
  // header terangkat sejauh tirai sudah naik dari dasar layar, berhenti saat sudah tak terlihat
  const lift = Math.max(-(top.offsetHeight + 2), Math.min(0, document.querySelector('main').getBoundingClientRect().bottom - innerHeight))
  top.style.setProperty('--lift', lift.toFixed(1) + 'px')
  const links = [...document.querySelectorAll('#nav-list a')], open = document.querySelector('main').getBoundingClientRect().bottom < innerHeight * .5
  const cur = document.querySelector('#nav-list a[aria-current]'), isC = cur && cur.getAttribute('href') === '#contact'
  if (open === !!isC) return
  links.forEach(a => a.getAttribute('href') === (open ? '#contact' : '#skills') ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'))
}
// tanpa Lenis (gerak dikurangi / CDN gagal): tautan ke kontak tetap mendarat benar saat tirai aktif
document.addEventListener('click', e => {
  if (lenis) return
  const a = e.target.closest('a[href^="#"]'), el = a && document.getElementById(a.getAttribute('href').slice(1))
  if (!el || !inCurtain(el)) return
  e.preventDefault()
  if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1')
  el.focus({ preventScroll: true })
  scrollTo({ top: document.documentElement.scrollHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
})

// ---- snap halus di zona tirai: scroll berhenti di tengah = meluncur ke tertutup atau terbuka penuh (kontak memenuhi layar)
let snapT = 0, snapping = false
function curtainSnap() {
  if (snapping || !root.classList.contains('curtain') || matchMedia('(prefers-reduced-motion: reduce)').matches) return
  const vh = innerHeight, bottom = document.querySelector('main').getBoundingClientRect().bottom
  if (bottom <= 2 || bottom >= vh - 2) return // sudah di salah satu ujung
  const end = document.documentElement.scrollHeight - vh, start = end - $('reveal').offsetHeight
  // lewat 35% terbuka = buka penuh; lebih sedikit = tutup lagi
  const target = bottom < vh * .65 ? end : start
  snapping = true
  const done = () => { snapping = false }
  if (lenis) lenis.scrollTo(target, { duration: 1.1, easing: t => 1 - Math.pow(1 - t, 4), onComplete: done })
  else { scrollTo({ top: target, behavior: 'smooth' }); setTimeout(done, 900) }
}
addEventListener('scroll', () => {
  if (snapping) return
  clearTimeout(snapT); snapT = setTimeout(curtainSnap, 160)
}, { passive: true })

// ---- paralaks kartu proyek: hanya desktop dengan mouse dan tanpa preferensi gerak dikurangi
const paraMq = matchMedia('(min-width:1024px) and (hover:hover) and (prefers-reduced-motion:no-preference)')
function para() {
  const cards = document.querySelectorAll('#proj-grid .card')
  if (!paraMq.matches) { cards.forEach(c => { c.style.removeProperty('--py'); c.style.removeProperty('--ps'); c.style.removeProperty('--ty') }); return }
  const vh = innerHeight
  cards.forEach(c => {
    if (c.hidden) return
    const r = c.getBoundingClientRect()
    if (r.bottom < -150 || r.top > vh + 150) return
    const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / (vh / 2 + r.height / 2)))
    const h = c.querySelector('.shot img').offsetHeight
    c.style.setProperty('--ps', '1.14') // ruang 7% di tiap sisi supaya geseran tidak memperlihatkan tepi gambar
    c.style.setProperty('--py', (p * h * .06).toFixed(1) + 'px')
    c.style.setProperty('--ty', (p * -28).toFixed(1) + 'px')
  })
}
paraMq.addEventListener('change', () => { para(); heroPara() })
// hero: teks naik makin cepat saat scroll ke bawah (kurva kuadrat), kontur lebih lambat untuk kesan kedalaman
function heroPara() {
  const h = document.querySelector('.hero')
  if (!h) return
  if (!paraMq.matches) { h.style.removeProperty('--hy'); h.style.removeProperty('--tpy'); return }
  const y = scrollY, H = h.offsetHeight
  if (y > H * 1.2) return
  const p = Math.min(1, y / H)
  h.style.setProperty('--hy', (-(y * .12 + p * p * 90)).toFixed(1) + 'px') // pelan: dipercepat halus, bukan melesat
  h.style.setProperty('--tpy', (y * .22).toFixed(1) + 'px')
}

// ---- sapuan diagonal bab gelap (pengganti transisi panel di video): miring saat tepi masuk layar, rata saat sudah di tengah
function slant() {
  const d = $('skills')
  if (!d) return
  const r = d.getBoundingClientRect(), vh = innerHeight, S = Math.min(170, innerWidth * .12)
  const c = v => Math.max(0, Math.min(1, v))
  d.style.setProperty('--tr', (S * c((r.top - vh * .15) / (vh * .75))).toFixed(1) + 'px')
  d.style.setProperty('--bl', (S * c((r.bottom - vh * .35) / (vh * .65))).toFixed(1) + 'px')
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  let sr = 0
  const onS = () => { cancelAnimationFrame(sr); sr = requestAnimationFrame(() => { slant(); para(); heroPara(); curtainNav() }) }
  addEventListener('scroll', onS, { passive: true })
  addEventListener('resize', onS)
}

topo()
render()
topState()
curtain()
slant()
para()
heroPara()
})()
</script>
