<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f4f1">
<title>Schema · Agung Fitrah Wibowo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Arah visual: kanvas editor node dari referensi pemilik (mockup "Sundays"), diisi ERD sungguhan.
   - kanvas abu terang bertitik: titiknya ikut bergeser dan membesar saat kanvas di-pan/zoom, jadi menunjukkan gerak, bukan hiasan
   - kartu putih membulat = tabel; tiap baris = satu record, garis pink = relasi dengan notasi crow's foot
   - pink hanya untuk garis relasi dan sorotan baris (satu aksen); lime/biru/magenta hanya di ubin ikon untuk
     membedakan jenis tabel (pekerjaan/proyek/keahlian), seperti ubin warna di referensi
   - Archivo melebar (wdth 108-125) meniru judul kartu referensi yang lebar dan geometris; lebar normal untuk teks isi
   - IBM Plex Mono kecil hanya untuk hal yang memang kode: nama kolom, PK/FK, nomor baris, persen zoom */
:root{
  --paper:#f4f4f1;--dot:#cdcdc6;--card:#fff;--line:#e4e4df;--line-2:#d3d3cc;--hover:#f3f3ef;
  --ink:#151515;--ink-2:#5c5c55;
  --wire:#e2457a;--tint:#fdecf2;--tint-2:#fbd5e3;
  --lime:#e3f45c;--blue:#3567ee;--pink:#f06ad6;--plain:#ecece7;
  --wide:'Archivo',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --top:60px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{background:var(--paper);color-scheme:light}
body{margin:0;color:var(--ink);font:400 16px/1.5 var(--wide);-webkit-font-smoothing:antialiased;background:var(--paper)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:50;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600}
.skip:focus{top:12px}

/* ---------- kepala: merek + breadcrumb seperti referensi ---------- */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:25;display:flex;align-items:center;gap:18px;
  padding:0 16px 0 20px;background:#fff;border-bottom:1px solid var(--line)}
.mark{font:700 22px/1 var(--wide);font-stretch:125%;letter-spacing:-.02em;color:var(--ink);text-decoration:none;flex:none;
  padding:8px 4px;border-radius:8px}
.crumb{display:flex;align-items:center;gap:4px;min-width:0;font:600 15px/1 var(--wide);font-stretch:110%}
.crumb a,.crumb .here{display:flex;align-items:center;gap:8px;padding:8px;border-radius:9px;color:var(--ink);text-decoration:none;min-width:0}
.crumb a{transition:background-color .3s}
.crumb a:hover{background:var(--hover)}
.crumb svg{width:20px;height:20px;flex:none}
.crumb .sep{color:var(--ink-2);font-weight:400}
.crumb .here img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 9%;flex:none;background:var(--plain)}
.crumb .here span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{margin-left:auto;display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;
  background:#fff;color:var(--ink);font:600 14px/1 var(--wide);font-stretch:108%;text-decoration:none;cursor:pointer;
  transition:background-color .3s,border-color .3s}
.btn:hover{background:var(--hover);border-color:#bdbdb5}
.btn:active{background:#e9e9e4}
@media (max-width:620px){.acts .ghost{display:none}.top{gap:8px;padding:0 12px}.mark{font-size:19px}}
@media (max-width:400px){.crumb .sep,.crumb a span{display:none}}

/* ---------- kanvas ---------- */
.vp{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:24px 24px}
.m-canvas,.m-canvas body{height:100%;overflow:hidden}
.m-canvas .vp{position:fixed;inset:var(--top) 0 0 0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.m-canvas .vp.grabbing{cursor:grabbing}
.m-canvas .vp:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.world{position:relative}
.m-canvas .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.glide .world{transition:transform .38s var(--ease)}
.glide.vp{transition:background-position .38s var(--ease),background-size .38s var(--ease)}
.wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.m-list .wires{display:none}
/* lebar dunia kanvas tidak boleh terbawa ke daftar (bikin halaman HP melebar dan ter-zoom out) */
.m-list .world{width:auto!important;height:auto!important}
/* zoom kecil: titik terlalu rapat, latar dibuat polos */
.m-canvas .vp.nodots{background-image:none}

/* garis relasi: aksen pink; garis putus-putus (disebut di deskripsi kerja) baru muncul saat disorot */
.e{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linecap:round;opacity:.55;transition:opacity .3s,stroke-width .3s}
.e circle{fill:#fff}
.e.imp{opacity:0}
.e.imp .cv{stroke-dasharray:5 6}
#ports{z-index:100000}
.lit .e{opacity:.08}
.lit .e.on{opacity:1;stroke-width:2.4}

/* ---------- kartu = tabel ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  /* bayangan tipis: kartu adalah benda yang bisa diseret di atas kanvas */
  box-shadow:0 1px 2px rgba(21,21,21,.04),0 12px 28px -20px rgba(21,21,21,.28)}
.m-canvas .card{position:absolute;width:var(--w)}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.m-canvas .card-head{cursor:grab}
.m-canvas .grabbing .card-head{cursor:grabbing}
.tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.tile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t-job{background:var(--lime);color:var(--ink)}
.t-pro{background:var(--blue);color:#fff}
.t-skl{background:var(--pink);color:var(--ink)}
.t-plain{background:var(--plain);color:var(--ink)}
.card-title{margin:0;font:650 19px/1.15 var(--wide);font-stretch:116%;letter-spacing:-.01em}
.card-sub{margin:4px 0 0;font:400 12.5px/1.3 var(--mono);color:var(--ink-2)}
.schema{margin:0 16px;padding:7px 0;border-top:1px dashed var(--line-2);border-bottom:1px solid var(--line);
  font:400 12px/1.45 var(--mono);color:var(--ink-2)}
.schema b{font-weight:500;color:var(--ink)}

.rows{list-style:none;margin:0;padding:6px 8px 10px}
.row{border-radius:10px;transition:opacity .3s}
.rb{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:7px 10px;border:0;border-radius:10px;background:none;
  text-align:left;color:var(--ink);text-decoration:none;cursor:pointer;transition:background-color .3s,box-shadow .3s}
.rb:hover{background:var(--hover)}
.rb:active{background:#ebebe6}
.rb:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
span.rb{cursor:text}
span.rb:hover{background:none}
.pk{flex:none;min-width:22px;font:500 12px/1 var(--mono);color:var(--ink-2)}
.pk.k{min-width:76px}
.tx{min-width:0}
.tx b{display:block;font-weight:600;font-size:15.5px;line-height:1.25}
.tx small{display:block;margin-top:2px;font-size:13px;line-height:1.3;color:var(--ink-2)}
.meta{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px}
.tag{font:650 11.5px/1 var(--wide);font-stretch:110%;padding:5px 7px;border-radius:6px;background:var(--lime);color:var(--ink)}
.cnt{font:500 12px/1 var(--mono);color:var(--ink-2)}
.m-canvas .lit .row{opacity:.42}
.m-canvas .lit .row.on{opacity:1}
.m-canvas .lit .row.on .rb{background:var(--tint)}
.m-canvas .lit .row.src .rb{background:var(--tint-2);box-shadow:inset 0 0 0 1.5px var(--wire)}

/* relasi tertulis: hanya di tampilan daftar, pengganti garis */
.rel{display:none}
.m-list .rel{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;margin:0 10px 8px 42px;font-size:13.5px;color:var(--ink-2)}
.rl{font:400 12px/1 var(--mono)}
.rs{color:var(--line-2)}
.go{border:0;background:none;padding:4px 2px;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--wire);
  text-underline-offset:3px;cursor:pointer;border-radius:4px;transition:color .3s}
.go:hover{color:var(--wire)}
.row.flash .rb{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,40%{background:var(--tint-2)}100%{background:transparent}}

/* profil: kartu paling besar dan satu-satunya dengan foto, jadi titik fokus kanvas */
.ph{gap:14px;padding-bottom:12px}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 9%;flex:none;background:var(--plain)}
.pname{margin:0;font:700 23px/1.1 var(--wide);font-stretch:118%;letter-spacing:-.015em}
.hl{margin:14px 16px 4px;font:600 17px/1.3 var(--wide);font-stretch:108%}
.hl mark{background:var(--lime);color:var(--ink);padding:0 4px;border-radius:4px}
.tagline{margin:0 16px 6px;color:var(--ink-2);font-size:15px}
.fields{margin:0;padding:6px 18px 16px}
.fields>div{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.fields>div:first-child{border-top:0}
.fields dt{flex:none;min-width:76px;font:400 12px/1.9 var(--mono);color:var(--ink-2)}
.fields dd{margin:0;font-size:15px;line-height:1.45}
.fields ul{list-style:none;margin:0;padding:0}

/* ---------- alat kanvas ---------- */
.tools{position:fixed;left:16px;top:calc(var(--top) + 20px);z-index:20;display:flex;flex-direction:column;gap:12px}
.grp{display:flex;flex-direction:column;gap:2px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 10px 24px -18px rgba(21,21,21,.3)}
.ib{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--ink);cursor:pointer;
  transition:background-color .3s}
.ib:hover{background:var(--hover)}
.ib:active{background:#e6e6e0}
.ib[aria-pressed="true"]{background:#e8e8e2}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#zoomv{display:block;padding:4px 0 2px;text-align:center;font:500 11.5px/1 var(--mono);color:var(--ink-2)}
.m-list .tools{left:50%;top:auto;bottom:16px;transform:translateX(-50%)}
.m-list .zoomg{display:none}
.m-list .viewg{flex-direction:row}

.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:15;max-width:calc(100vw - 32px);margin:0;
  padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.35;color:var(--ink-2);text-align:center}
.c-legend{padding:14px 16px;font-size:13.5px;color:var(--ink-2)}
.c-legend h2{margin:0 0 10px;font:650 15px/1 var(--wide);font-stretch:112%;color:var(--ink)}
.c-legend ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.c-legend li{display:flex;align-items:center;gap:12px;line-height:1.35}
.c-legend svg{width:40px;height:14px;flex:none;fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linecap:round}
.m-list #c-legend{display:none}
.used .hint{display:none}
.m-list .hint{display:none}
@media (max-width:700px){.hint{left:72px;right:16px;transform:none;max-width:none;text-align:left}}

/* ---------- tampilan daftar ---------- */
.m-list .vp{min-height:100vh;padding:calc(var(--top) + 24px) 16px 120px}
.m-list #cards{display:flex;flex-direction:column;gap:20px;max-width:720px;margin:0 auto}
.m-list .card{position:static;width:auto}

/* ---------- panel detail ---------- */
.panel{position:fixed;top:calc(var(--top) + 12px);right:16px;bottom:16px;z-index:30;width:min(400px,calc(100vw - 32px));
  display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;
  /* bayangan tebal satu-satunya: panel melayang di atas kanvas dan kartu */
  box-shadow:0 28px 60px -28px rgba(21,21,21,.45)}
.panel[hidden]{display:none}
.pn-top{display:flex;align-items:center;gap:10px;padding:12px 12px 4px 20px}
.pn-kind{font:400 12.5px/1 var(--mono);color:var(--ink-2)}
.pn-top .ib{margin-left:auto}
.pn-body{overflow:auto;padding:4px 20px 24px;overscroll-behavior:contain}
.pn-body h2{margin:6px 0 4px;font:700 24px/1.12 var(--wide);font-stretch:116%;letter-spacing:-.015em;outline:0}
.pn-sub{margin:0 0 16px;color:var(--ink-2);font-size:15px}
.shots{display:grid;gap:10px;margin:0 0 18px}
.shot{margin:0;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--plain);border:1px solid var(--line);position:relative}
.shot img{width:100%;height:100%;object-fit:cover;object-position:50% 0}
.shot.miss img{display:none}
.shot.miss::after{content:attr(data-miss);position:absolute;inset:0;display:grid;place-items:center;font:400 12.5px/1 var(--mono);color:var(--ink-2)}
.pn-dl{margin:0}
.pn-dl dt{margin-top:16px;font:400 12px/1.4 var(--mono);color:var(--ink-2)}
.pn-dl dd{margin:4px 0 0;font-size:15.5px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:4px 10px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font-size:14px}
button.chip{cursor:pointer;font-weight:600;transition:background-color .3s,border-color .3s}
button.chip:hover{background:var(--tint);border-color:var(--wire)}
.empty{color:var(--ink-2)}
@media (max-width:880px){.panel{top:calc(var(--top) + 8px);left:8px;right:8px;bottom:8px;width:auto}}

/* ---------- galat ---------- */
.err{position:fixed;inset:var(--top) 0 0 0;display:grid;place-items:center;padding:24px;z-index:40;background:var(--paper)}
.err[hidden]{display:none}
.err div{max-width:440px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.err p{margin:0 0 16px}
.err .acts{margin:0;justify-content:flex-start}

@media (prefers-reduced-motion:reduce){
  .glide .world,.glide.vp{transition:none}
  .row.flash .rb{animation:none;background:var(--tint-2)}
}
</style>
</head>
<body>
<a class="skip" href="#cards" data-t="skip">Skip to the diagram</a>

<header class="top">
  <a class="mark" href="../../" data-main data-t-aria="mainAria">AFW</a>
  <nav class="crumb" data-t-aria="crumbAria">
    <a href="../" data-lab aria-label="Lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span>Lab</span></a>
    <span class="sep" aria-hidden="true">/</span>
    <span class="here" aria-current="page"><img src="../../assets/foto-agung.webp" width="600" height="1095" alt=""><span data-t="title">Portfolio schema</span></span>
  </nav>
  <div class="acts">
    <a class="btn ghost" href="../../" data-main data-t="main">Main site</a>
    <button class="btn" id="lang-btn" type="button">ID</button>
  </div>
</header>

<main id="main">
  <div class="vp" id="vp" tabindex="0" role="region" data-t-aria="vpAria">
    <div class="world" id="world">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <div id="cards" tabindex="-1"></div>
      <svg class="wires" id="ports" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="tools" role="toolbar" data-t-aria="toolsAria">
    <div class="grp zoomg">
      <button class="ib" type="button" id="z-fit" data-t-aria="fit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ib" type="button" id="z-in" data-t-aria="zin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" type="button" id="z-out" data-t-aria="zout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <output id="zoomv" aria-live="polite">100%</output>
    </div>
    <div class="grp viewg">
      <button class="ib" type="button" id="v-canvas" data-t-aria="vCanvas" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h2.5a2 2 0 0 1 2 2v5"/></svg></button>
      <button class="ib" type="button" id="v-list" data-t-aria="vList" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><rect x="3.5" y="4.5" width="3" height="3" rx=".6"/><rect x="3.5" y="10.5" width="3" height="3" rx=".6"/><rect x="3.5" y="16.5" width="3" height="3" rx=".6"/></svg></button>
    </div>
  </div>

  <p class="hint" id="hint"></p>


  <div class="err" id="err" hidden>
    <div>
      <p data-t="err">The portfolio data did not load, so the diagram is empty. Reload the page, or open the main site.</p>
      <div class="acts">
        <button class="btn" type="button" id="err-reload" data-t="errBtn">Reload</button>
        <a class="btn" href="../../" data-main data-t="main">Main site</a>
      </div>
    </div>
  </div>
</main>

<aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="pn-h" hidden>
  <div class="pn-top">
    <span class="pn-kind" id="pn-kind"></span>
    <button class="ib" type="button" id="pn-x" data-t-aria="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="pn-body" id="pn-body"></div>
</aside>

<script src="../../js/data.js"></script>

  }

  // ---------- sorotan relasi ----------
  var sel = null, hoverN = null
  function light(n) {
    $$('.row.on', cardsEl).forEach(function (li) { li.classList.remove('on', 'src') })
    edgeEl.forEach(function (g) { g.classList.remove('on') })
    world.classList.toggle('lit', !!n)
    if (!n || !rowEl[n]) return
    rowEl[n].classList.add('on', 'src')
    ;(adj[n] || []).forEach(function (m) { if (rowEl[m]) rowEl[m].classList.add('on') })
    edgeEl.forEach(function (g) { var e = edges[g.dataset.i]; if (e.a === n || e.b === n) g.classList.add('on') })
  }
  cardsEl.addEventListener('mouseover', function (e) {
    var li = e.target.closest('.row[data-node]'), n = li ? li.dataset.node : null
    if (n !== hoverN) { hoverN = n; light(n || sel) }
  })
  cardsEl.addEventListener('mouseleave', function () { hoverN = null; light(sel) })
  cardsEl.addEventListener('focusin', function (e) {
    var b = e.target.closest('.rb[data-node]')
    if (b) { hoverN = b.dataset.node; light(hoverN); ensureVisible(b) }
    else if (e.target.closest('.rb')) ensureVisible(e.target)
  })
  cardsEl.addEventListener('focusout', function () { hoverN = null; light(sel) })

  // ---------- pan & zoom ----------
  var view = { x: 0, y: 0, s: 1 }, userMoved = false
  function used() { userMoved = true; root.classList.add('used') }
  function apply() {
    world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.s + ')'
    var g = 24 * view.s
    vp.style.backgroundSize = g + 'px ' + g + 'px'
    vp.style.backgroundPosition = view.x + 'px ' + view.y + 'px'
    $('#zoomv').textContent = Math.round(view.s * 100) + '%'
    vp.classList.toggle('nodots', view.s < 0.6)
  }
  var glideT
  function glide() {
    if (reduce) return
    vp.classList.add('glide'); clearTimeout(glideT)
    glideT = setTimeout(function () { vp.classList.remove('glide') }, 420)
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)) }
  function zoomAt(cx, cy, s) {
    s = clamp(s, 0.3, 2)
    var k = s / view.s
    view.x = cx - (cx - view.x) * k; view.y = cy - (cy - view.y) * k; view.s = s
    apply()
  }
  function bounds() {
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
    CARDS.forEach(function (c) {
      var p = pos[c.id], el = cardEl[c.id]
      x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1])
      x1 = Math.max(x1, p[0] + el.offsetWidth); y1 = Math.max(y1, p[1] + el.offsetHeight)
    })
    // ruang untuk garis lengkung di kiri kolom profil
    return { x: x0 - 60, y: y0 - 20, w: x1 - x0 + 80, h: y1 - y0 + 40 }
  }
  // minS: skala terkecil yang diterima; kalau tidak muat, tampilkan sudut kiri atas (profil dulu)
  function fit(minS) {
    var b = bounds(), r = vp.getBoundingClientRect()
    var left = 72, aw = r.width - left - 16, ah = r.height - 64
    var s = clamp(Math.min(1, aw / b.w, ah / b.h), minS || 0.3, 2)
    view.s = s
    view.x = left + Math.max(0, (aw - b.w * s) / 2) - b.x * s
    view.y = 8 + Math.max(0, (ah - b.h * s) / 2) - b.y * s
    apply()
  }
  function initialView() { fit(innerWidth > 880 ? 0.8 : 0.6) }

  function ensureVisible(el) {
    if (!isCanvas()) return
    var r = el.getBoundingClientRect(), v = vp.getBoundingClientRect()
    var L = v.left + 72, R = v.right - 16, Tp = v.top + 12, B = v.bottom - 64
    if (!panel.hidden && innerWidth > 880) R = panel.getBoundingClientRect().left - 16
    var dx = 0, dy = 0
    if (r.left < L || r.width > R - L) dx = L - r.left + 8
    else if (r.right > R) dx = R - r.right - 8
    if (r.top < Tp) dy = Tp - r.top + 8
    else if (r.bottom > B) dy = B - r.bottom - 8
    if (dx || dy) { glide(); view.x += dx; view.y += dy; apply() }
  }
  // fokus keyboard pada baris di dalam kanvas tidak boleh menggulir viewport (overflow:hidden tetap bisa tergulir)
  vp.addEventListener('scroll', function () { if (isCanvas()) { vp.scrollTop = 0; vp.scrollLeft = 0 } })

  vp.addEventListener('wheel', function (e) {
    if (!isCanvas()) return
    e.preventDefault(); used()
    var u = e.deltaMode === 1 ? 16 : 1, r = vp.getBoundingClientRect()
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, view.s * Math.exp(-e.deltaY * u * 0.01))
    else { view.x -= e.deltaX * u; view.y -= e.deltaY * u; apply() }
  }, { passive: false })

  var ptrs = {}, drag = null, pinch = null, moved = false
  function rel2vp(x, y) { var r = vp.getBoundingClientRect(); return { x: x - r.left, y: y - r.top } }
  vp.addEventListener('pointerdown', function (e) {
    if (!isCanvas() || (e.pointerType === 'mouse' && e.button !== 0)) return
    moved = false
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }
    var ids = Object.keys(ptrs)
    if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]], m = rel2vp((a.x + b.x) / 2, (a.y + b.y) / 2)
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: view.s, wx: (m.x - view.x) / view.s, wy: (m.y - view.y) / view.s }
      drag = null; moved = true
      return
    }
    var h = e.target.closest('.card-head'), card = h && h.closest('.card')
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, vx: view.x, vy: view.y, on: false,
      card: card ? card.dataset.card : null, p: card ? pos[card.dataset.card].slice() : null }
  })
  vp.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) return
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }
    if (pinch) {
      var ids = Object.keys(ptrs); if (ids.length < 2) return
      var a = ptrs[ids[0]], b = ptrs[ids[1]], m = rel2vp((a.x + b.x) / 2, (a.y + b.y) / 2)
      view.s = clamp(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 0.3, 2)
      view.x = m.x - pinch.wx * view.s; view.y = m.y - pinch.wy * view.s
      used(); apply(); return
    }
    if (!drag || drag.id !== e.pointerId) return
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0
    if (!drag.on) {
      if (Math.abs(dx) + Math.abs(dy) < 6) return
      drag.on = true; moved = true; used()
      try { vp.setPointerCapture(e.pointerId) } catch (er) {}
      vp.classList.add('grabbing')
      if (drag.card) { manual[drag.card] = 1; cardEl[drag.card].style.zIndex = ++zTop }
    }
    if (drag.card) {
      pos[drag.card] = [drag.p[0] + dx / view.s, drag.p[1] + dy / view.s]
      place(drag.card); drawWires()
    } else { view.x = drag.vx + dx; view.y = drag.vy + dy; apply() }
  })
  function endPtr(e) {
    delete ptrs[e.pointerId]
    if (pinch && Object.keys(ptrs).length < 2) pinch = null
    if (drag && drag.id === e.pointerId) { drag = null; vp.classList.remove('grabbing') }
  }
  vp.addEventListener('pointerup', endPtr)
  vp.addEventListener('pointercancel', endPtr)
  // seretan bukan klik
  vp.addEventListener('click', function (e) { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false } }, true)

  function zoomBtn(f) { var r = vp.getBoundingClientRect(); glide(); used(); zoomAt(r.width / 2, r.height / 2, view.s * f) }
  $('#z-in').addEventListener('click', function () { zoomBtn(1.2) })
  $('#z-out').addEventListener('click', function () { zoomBtn(1 / 1.2) })
  $('#z-fit').addEventListener('click', function () { glide(); used(); fit(0.3) })
  vp.addEventListener('keydown', function (e) {
    if (!isCanvas() || e.target !== vp) return
    var k = e.key, step = 80
    if (k === 'ArrowLeft') view.x += step
    else if (k === 'ArrowRight') view.x -= step
    else if (k === 'ArrowUp') view.y += step
    else if (k === 'ArrowDown') view.y -= step
    else if (k === '+' || k === '=') return zoomBtn(1.2), e.preventDefault()
    else if (k === '-') return zoomBtn(1 / 1.2), e.preventDefault()
    else if (k === '0') { e.preventDefault(); glide(); fit(0.3); return }
    else return
    e.preventDefault(); used(); glide(); apply()
  })

  // ---------- tampilan: kanvas / daftar ----------
  function setMode(m, save) {
    root.classList.toggle('m-canvas', m === 'canvas')
    root.classList.toggle('m-list', m === 'list')
    $('#v-canvas').setAttribute('aria-pressed', m === 'canvas')
    $('#v-list').setAttribute('aria-pressed', m === 'list')
    if (m === 'canvas') { layout(); initialView(); userMoved = false }
    else { world.style.transform = ''; world.style.width = ''; world.style.height = ''; vp.classList.remove('nodots'); vp.style.backgroundSize = ''; vp.style.backgroundPosition = ''; world.classList.remove('lit') }
    if (save) try { localStorage.setItem('afw-schema-view', m) } catch (e) {}
  }
  $('#v-canvas').addEventListener('click', function () { setMode('canvas', true) })
  $('#v-list').addEventListener('click', function () { setMode('list', true); scrollTo(0, 0) })

  // ---------- panel detail ----------
  var opener = null
  function chips(keysOrTok) { return '<div class="chips">' + keysOrTok + '</div>' }
  function nodeList(ns, empty) {
    return ns.length ? chips(ns.map(function (m) { return goBtn(m, 'chip') }).join('')) : '<p class="empty">' + esc(empty) + '</p>'
  }
  function nb(n, kind) { return (adj[n] || []).filter(function (m) { return m.indexOf(kind + ':') === 0 }) }
  function panelHTML(n) {
    var p = n.split(':'), k = p[0], v = p[1], o = ''
    if (k === 'pro') {
      var pr = D.projects[v], imgs = pr.imgs || []
      o += '<h2 id="pn-h" tabindex="-1">' + esc(pr.name) + '</h2><p class="pn-sub">' + esc(pr.cat) + '</p>'
      if (imgs.length) o += '<div class="shots">' + imgs.map(function (src, i) {
        return '<figure class="shot" data-miss="' + esc(t.miss) + '"><img src="' + ASSETS + esc(src) + '" width="1100" height="688" loading="lazy" decoding="async" alt="' + esc(t.shot(pr.name, i + 1, imgs.length)) + '"></figure>'
      }).join('') + '</div>'
      o += '<dl class="pn-dl"><dt>' + t.pClient + '</dt><dd>' + esc(pr.client) + '</dd>' +
        '<dt>' + t.pRole + '</dt><dd>' + esc(pr.role) + '</dd>' +
        '<dt>' + t.pTools + '</dt><dd>' + chips(proTools[v].map(function (x) {
          return x.keys.length ? x.keys.map(function (m) { return goBtn(m, 'chip') }).join('') : '<span class="chip">' + esc(x.tok) + '</span>'
        }).join('')) + '</dd>' +
        (proJob[v] >= 0 ? '<dt>' + t.pJob + '</dt><dd>' + chips(goBtn('job:' + proJob[v], 'chip')) + '</dd>' : '') + '</dl>'
    } else if (k === 'job') {
      var j = D.jobs[v], sk = nb(n, 'skl')
      o += '<h2 id="pn-h" tabindex="-1">' + esc(j.company) + '</h2><p class="pn-sub">' + esc(j.period) + '</p>' +
        '<dl class="pn-dl"><dt>' + t.jRole + '</dt><dd>' + esc(j.role) + '</dd><dt>' + t.jDesc + '</dt><dd>' + esc(j.desc) + '</dd>' +
        '<dt>' + t.jPros + '</dt><dd>' + nodeList(nb(n, 'pro'), t.jNoPro) + '</dd>' +
        (sk.length ? '<dt>' + t.jSkl + '</dt><dd>' + nodeList(sk) + '</dd>' : '') + '</dl>'
    } else {
      var gi = v.split('-'), g = D.skills.groups[gi[0]], jobsN = nb(n, 'job')
      o += '<h2 id="pn-h" tabindex="-1">' + esc(g.items[gi[1]].name) + '</h2><p class="pn-sub">' + t.sGroup + ': ' + esc(g.label) + '</p>' +
        '<dl class="pn-dl"><dt>' + t.sPros + '</dt><dd>' + nodeList(nb(n, 'pro'), t.sNone) + '</dd>' +
        (jobsN.length ? '<dt>' + t.sJobs + '</dt><dd>' + nodeList(jobsN) + '</dd>' : '') + '</dl>'
    }
    return o
  }
  function openPanel(n, fromRow) {
    if (fromRow) opener = fromRow
    sel = n
    $('#pn-kind').textContent = t.kind[n.split(':')[0]]
    $('#pn-body').innerHTML = panelHTML(n)
    $('#pn-body').scrollTop = 0
    panel.hidden = false
    light(n)
    $$('.shot img', panel).forEach(function (img) {
      img.addEventListener('error', function () { img.parentNode.classList.add('miss') })
    })
    if (rowEl[n]) ensureVisible(rowEl[n])
    $('#pn-h').focus({ preventScroll: true })
  }
  function closePanel() {
    if (panel.hidden) return
    panel.hidden = true; sel = null; light(hoverN)
    if (opener && document.body.contains(opener)) opener.focus({ preventScroll: true })
    opener = null
  }
  $('#pn-x').addEventListener('click', closePanel)
  addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel() })
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]')
    if (!b) return
    var n = b.dataset.go
    openPanel(n)
    if (!isCanvas() && rowEl[n]) rowEl[n].scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' })
  })
  cardsEl.addEventListener('click', function (e) {
    var go = e.target.closest('.go'), rb = e.target.closest('.rb[data-node]')
    if (go) {
      var li = rowEl[go.dataset.go]; if (!li) return
      li.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' })
      li.classList.remove('flash'); void li.offsetWidth; li.classList.add('flash')
      li.querySelector('.rb').focus({ preventScroll: true })
      return
    }
    if (rb) openPanel(rb.dataset.node, rb)
  })
  // klik di area kosong kanvas (bukan seretan) menutup panel
  vp.addEventListener('click', function (e) { if (!e.target.closest('.card')) closePanel() })

  // ---------- jalankan ----------
  function render() {
    var keepSel = sel
    t = T[lang]
    chrome()
    renderCards()
    if (isCanvas()) layout()
    if (keepSel && !panel.hidden) openPanel(keepSel)
  }
  $('#lang-btn').addEventListener('click', function () {
    lang = lang === 'id' ? 'en' : 'id'
    try { localStorage.setItem('afw-lang', lang) } catch (e) {}
    render()
  })

  var saved = ''
  try { saved = localStorage.getItem('afw-schema-view') || '' } catch (e) {}
  chrome(); renderCards()
  setMode(saved === 'canvas' || saved === 'list' ? saved : (innerWidth > 880 ? 'canvas' : 'list'))
  // tinggi kartu berubah setelah font dimuat: hitung ulang garis, dan pas-kan lagi kalau pengunjung belum menggeser
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () {
    if (!isCanvas()) return
    layout(); if (!userMoved) initialView()
  })
  var rz
  addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (isCanvas() && !userMoved) initialView() }, 150) })
})()
</script>
</body>
</html>
